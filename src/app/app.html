<h1>Practica 24 - API GET</h1>

  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
    </tr>
  </thead>
  <tbody>
    @for (dat of listaComentarios(); track dat.id) {

        <td>{{ dat.id }}</td>

      </tr>
    }
  </tbody>
</table>
