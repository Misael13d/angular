<h3>Ingresar al sistema</h3>
	<form  [formGroup]="regForm" (ngSubmit)="enviarDatosFormulario()">
		<label for="">Login</label>
		<input type="text" formControlName="login"> <br>
		<label for="">clave:</label>
		<input type="text" formControlName="clave"><br>
		<button type="submit" (click)="enviarDatosFormulario()">Enviar login</button>
	</form>



<h3>Lista Predios</h3>
<ul>
  @for (dat of listaPredios(); track dat){
    <li>{{dat.nompredio}}</li>
  }
</ul>
